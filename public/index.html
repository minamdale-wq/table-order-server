<style>
/* VOICE: 매장 카운터 장비처럼 단단하고 큼직하게, 군더더기 없이
   IDEA: 스크린골프 룸의 잔디색 스코어보드 + 주방 주문 전표
   PICTURE: 고객 화면은 메뉴판 자체, 카운터는 전표가 꽂힌 보드
   COLOUR and TYPE: 잔디 초록 띠, 흰 카드, 주황은 '주문' 버튼에만 / Gothic A1
   LAYOUT: 30인치 고객 화면 = 분류 | 메뉴 | 장바구니 + 하단 동영상 띠, 카운터 = 탭 + 보드 */
:root{color-scheme:light dark;--bg:light-dark(#f3f5f1,#0c1310);--card:light-dark(#fff,#151f1a);--ink:light-dark(#13201a,#edf3ee);--mute:light-dark(#5b6a61,#97a99e);--line:light-dark(#dbe3dc,#26352d);--turf:#1d7548;--turf2:light-dark(#e1f0e6,#163024);--hot:#ff6a1a;--bad:#d6392a;--ok:#1d9a57;--warn:light-dark(#b26b00,#ffb84d);--vidh:40vh}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Gothic A1",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
input,select,textarea{font-size:16px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);width:100%}
textarea{min-height:88px}
input[type=checkbox]{width:22px;min-height:22px;accent-color:var(--turf)}
input[type=range]{padding:0;border:0;accent-color:var(--turf)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:10px;background:var(--turf);color:#fff;font-weight:600;white-space:nowrap}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid light-dark(#8e9c93,#6b7d72);font-weight:700}
.btn.bad{background:var(--bad)}.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn:disabled,.cta:disabled{opacity:.4;cursor:not-allowed}
.cta{min-height:64px;border-radius:14px;background:var(--hot);color:#fff;font-weight:800;font-size:1.25em;padding:10px 22px}
.link{color:var(--mute);text-decoration:underline;min-height:44px;padding:0 6px}
.fine{color:var(--mute);font-size:13px;margin:6px 0 0}
.need{display:inline-block;background:light-dark(#fff1d6,#3a2a0c);color:var(--warn);border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600;white-space:nowrap}
.splash{min-height:100dvh;display:grid;place-content:center;text-align:center;padding:24px;gap:8px}
.splash b{font-size:22px}
/* ---------- 고객 화면 ---------- */
.cust{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) var(--vidh);font-size:clamp(16px,1.1vw,26px)}
.chead{display:flex;align-items:center;gap:1em;background:var(--turf);color:#fff;padding:.55em 1.2em}
.logo{color:#fff;font-weight:800;font-size:1.3em;min-height:44px;letter-spacing:-.02em}
.ctitle{font-weight:800;font-size:1.3em;flex:1}
.cbadge{background:#ffd24d;color:#3a2a00;border-radius:8px;padding:.15em .6em;font-weight:800;font-size:.85em}
.conn{display:inline-flex;align-items:center;gap:.4em;font-size:.85em}
.conn i{width:.7em;height:.7em;border-radius:50%;background:#7ef0a8;box-shadow:0 0 0 3px #ffffff30}
.conn.off i{background:#ff6b5e}
.hbtn{background:#ffffff22;color:#fff;border-radius:10px;padding:.4em .9em;min-height:44px;font-weight:600}
.hbtn.call{background:#fff;color:var(--turf);font-weight:800}.hbtn.call.on{background:#ffd24d;color:#3a2a00}
.calls{background:var(--hot);color:#fff;padding:8px max(3vw,16px);display:grid;gap:6px}.calls[hidden]{display:none}
.callrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:18px}.callrow b{font-size:20px}.callrow time{opacity:.85;font-size:15px;flex:1}.callrow .btn{background:#fff;color:var(--hot)}
.cbody{display:grid;grid-template-columns:clamp(130px,11vw,230px) minmax(0,1fr) clamp(300px,25vw,500px);min-height:0}
.cats{display:flex;flex-direction:column;gap:.35em;padding:1em .6em;overflow:auto;background:var(--turf2)}
.cats button{text-align:left;padding:.7em .8em;border-radius:12px;font-weight:600;min-height:56px}
.cats button.on{background:var(--turf);color:#fff}
.subs{grid-column:1/-1;display:flex;gap:.5em;flex-wrap:wrap;position:sticky;top:-1em;background:var(--bg);padding:.5em 0;z-index:2}
.subs button{min-height:52px;padding:.4em 1.3em;border-radius:999px;border:2px solid light-dark(#8e9c93,#6b7d72);background:var(--card);font-weight:800}
.subs button.on{background:var(--turf);border-color:var(--turf);color:#fff}
.gsec{grid-column:1/-1;margin:.5em 0 -.3em;font-size:1.15em;display:flex;align-items:center;gap:.6em}.gsec::after{content:'';flex:1;border-top:2px solid var(--line)}
.catline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}.catline .tag.top{font-size:15px;font-weight:800;background:var(--turf);color:#fff}.catline .tag.top button{color:#fff}
.grid{overflow:auto;padding:1em;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(170px,14vw,300px),1fr));grid-auto-rows:max-content;gap:1em;align-content:start}
.mcard{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:44px}
.mcard img,.mcard .ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--turf2)}
.mcard .ph{display:grid;place-items:center;font-size:2.4em;font-weight:800;color:var(--turf)}
.mcard .mn{font-weight:800;padding:.55em .7em 0;font-size:1.05em;line-height:1.25}
.mcard .md{padding:.2em .7em 0;color:var(--mute);font-size:.8em;line-height:1.35}
.mcard .mp{padding:.35em .7em .7em;font-weight:800;color:var(--turf);margin-top:auto}
.mcard .mo{position:absolute;top:.5em;right:.5em;background:var(--card);border-radius:8px;padding:.1em .5em;font-size:.72em;font-weight:600}
.mcard.so{opacity:.55;cursor:not-allowed}
.stamp{position:absolute;inset:0;display:grid;place-items:center;font-size:2em;font-weight:800;color:var(--bad);background:light-dark(#ffffffaa,#000000aa)}
.cart{display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--card);min-height:0}
.carth{display:flex;align-items:center;gap:.6em;padding:.8em 1em;border-bottom:1px solid var(--line)}
.carth b{font-size:1.15em;flex:1}
.lines{flex:1;overflow:auto;padding:.4em 1em}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.3em .8em;padding:.7em 0;border-bottom:1px dashed var(--line)}
.line small{display:block;color:var(--mute);font-size:.78em}
.line em{display:block;color:var(--bad);font-style:normal;font-size:.8em;font-weight:600}

const CHIMES=[[523,659],[587,784],[659,880],[784,1047],[440,659,880],[523,784,1319],[698,880],[392,587,784]];
function chime(t,kind){return new Promise(done=>{if(!S.beep||!S.ac){done();return}

 setTimeout(done,notes.length*gap*1000+450)})}

 let q=S.db.collection('orders').where('dateKey','in',[addDays(S.today,-1),S.today]);
 if(S.role==='customer')q=q.where('tabletId','==',S.dev);
 let first=true;
 S.ordUnsub=q.onSnapshot(s=>{S.orders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));if(S.role==='customer')custOrders(first);
  if(S.role==='counter'&&!first){const n=s.docChanges().filter(c=>c.type==='added'&&c.doc.data().status==='new').length;if(n){s.docChanges().filter(c=>c.type==='added'&&c.doc.data().status==='new').forEach(c=>{const x=c.doc.data();announce(x.tabletId,'order','',x.test)});toast('새 주문 '+n+'건','new')}}

 let cf=true;S.calls=[];S.subs.push(S.db.collection('calls').where('status','==','open').onSnapshot(s=>{S.calls=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.at||0)-(b.at||0));if(!cf){const n=s.docChanges().filter(c=>c.type==='added').length;if(n){s.docChanges().filter(c=>c.type==='added').forEach(c=>{const x=c.doc.data();announce(x.tabletId,'call',x.reason,x.test)});toast('직원 호출: '+s.docChanges().filter(c=>c.type==='added').map(c=>{const x=c.doc.data();return x.place||x.tabletName}).join(', '),'new')}}cf=false;renderCalls()},err));

let ytReady=null;
function loadYT(){if(window.YT&&window.YT.Player)return Promise.resolve();if(ytReady)return ytReady;
 ytReady=new Promise((ok,no)=>{const t=setTimeout(()=>{ytReady=null;no()},10000);const prev=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=()=>{clearTimeout(t);if(prev)try{prev()}catch(e){}ok()};
  const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';sc.onerror=()=>{clearTimeout(t);ytReady=null;sc.remove();no()};document.head.appendChild(sc)});return ytReady}
function vNext(){const l=S.vlist||[];if(!l.length)return;if(l.length===1){const it=l[0];if(it.src){const v=$('#vid');if(v){v.currentTime=0;v.play().catch(()=>{})}}else if(S.ytp&&S.ytp.seekTo){S.ytp.seekTo(0);S.ytp.playVideo()}return}S.vidx=(S.vidx+1)%l.length;vPlay()}
function vMsg(t){const e=$('#vempty');if(!e)return;S.vErr=!!t;e.textContent=t||'동영상이 등록되지 않았습니다';e.hidden=!t&&!!(S.vlist||[]).length}
function vPlay(){const v=$('#vid'),yw=$('#ytwrap');if(!v)return;const l=S.vlist||[];clearTimeout(S.vRetry);vMsg('');
 if(!l.length){v.removeAttribute('src');yw.hidden=true;try{S.ytp&&S.ytp.stopVideo&&S.ytp.stopVideo()}catch(e){}return}
 let it=l[S.vidx%l.length];
 if(it.yt&&S.ytDown&&NOW()-S.ytDown<60000&&l.some(x=>x.src)){while(!l[S.vidx%l.length].src)S.vidx=(S.vidx+1)%l.length;it=l[S.vidx]}
 if(it.src){yw.hidden=true;try{S.ytp&&S.ytp.pauseVideo&&S.ytp.pauseVideo()}catch(e){}v.hidden=false;v.loop=l.length===1;v.src=it.src;v.play().catch(()=>{});return}
 v.pause();v.removeAttribute('src');v.hidden=true;yw.hidden=false;const gen=S.vGen=(S.vGen||0)+1;
 loadYT().then(()=>{S.ytDown=0;if(gen!==S.vGen)return;
  if(S.ytp&&S.ytp.loadVideoById){S.ytp.mute();S.ytp.loadVideoById(it.yt);setTimeout(ytVol,600);setTimeout(ytNoCC,1500);return}
  S.ytp=new YT.Player('yt',{width:'100%',height:'100%',videoId:it.yt,playerVars:{autoplay:1,mute:1,controls:0,cc_load_policy:0,disablekb:1,fs:0,rel:0,iv_load_policy:3,playsinline:1,origin:location.origin},
   events:{onReady:e=>{e.target.mute();e.target.playVideo();ytNoCC();setTimeout(ytVol,600)},onStateChange:e=>{if(e.data===1)ytNoCC();if(e.data===0)vNext();else if(e.data===2&&!S.vErr){setTimeout(()=>{try{if(S.ytp.getPlayerState()===2){S.ytp.mute();S.volBlocked=!S.vol.m&&!!S.vol.v;volUI();S.ytp.playVideo()}}catch(x){}},800)}},onError:()=>{vMsg('이 유튜브 영상은 재생할 수 없습니다 (퍼가기 금지 또는 삭제)');S.vRetry=setTimeout(()=>{if((S.vlist||[]).length>1)vNext();else vMsg('이 유튜브 영상은 재생할 수 없습니다 (퍼가기 금지 또는 삭제)')},4000)}}})})
 .catch(()=>{S.ytDown=NOW();vMsg('유튜브에 연결할 수 없습니다 (태블릿 인터넷 확인)');S.vRetry=setTimeout(()=>{if((S.vlist||[]).length>1)vNext();else vPlay()},l.length>1?3000:30000)})}

function lineCalc(l){const m=menuById(l.mid);if(!m)return{ok:false,why:'메뉴가 삭제됨',unit:0,name:l.name};
 if(m.soldOut||m.hidden)return{ok:false,why:'품절',unit:0,name:m.name};let unit=Number(m.price)||0;const opts=[];
 for(const o of l.opts){const g=(m.groups||[]).find(x=>x.name===o.g);const c=g&&(g.choices||[]).find(x=>x.name===o.n);if(!c)return{ok:false,why:'옵션이 바뀜',unit:0,name:m.name};unit+=Number(c.price)||0;opts.push({g:o.g,n:o.n,p:Number(c.price)||0})}
 return{ok:true,unit,name:m.name,opts}}

 ${S.mOrder?'':`<div class="panel" style="margin-bottom:16px"><h3>분류 <span class="fine">큰 분류 왼쪽, 하위 분류 오른쪽 · ‹ › 로 순서 변경</span></h3>${(S.config.categories||[]).map((c,i)=>`<div class="catline"><span class="tag top">${esc(c)}<button data-act="catup" data-i="${i}" aria-label="앞으로">‹</button><button data-act="catdn" data-i="${i}" aria-label="뒤로">›</button><button data-act="catdel" data-i="${i}" aria-label="삭제">×</button></span><span class="fine">하위:</span>${subsOf(c).map((sb,j)=>`<span class="tag">${esc(sb)}<button data-act="subup" data-i="${i}" data-j="${j}" aria-label="앞으로">‹</button><button data-act="subdn" data-i="${i}" data-j="${j}" aria-label="뒤로">›</button><button data-act="subdel" data-i="${i}" data-j="${j}" aria-label="삭제">×</button></span>`).join('')}<input id="newSub-${i}" placeholder="하위 분류 이름" style="max-width:170px;min-height:38px"><button class="btn sm ghost" data-act="subadd" data-i="${i}">하위 추가</button></div>`).join('')||'<span class="fine">분류가 없습니다</span>'}
 <div class="catrow" style="margin-top:8px"><input id="newCat" placeholder="새 큰 분류 이름" style="max-width:260px"><button class="btn ghost" data-act="catadd">큰 분류 추가</button></div></div>`}
 ${S.menu.length?'':`<div class="panel"><b>등록된 메뉴가 없습니다.</b><span class="fine">메뉴·옵션·가격 ${NEED} — 실제 메뉴판을 기준으로 입력해 주세요. 여기서 바꾸면 모든 주문용 태블릿에 바로 반영됩니다.</span></div>`}
 ${cs.map(c=>{const ms=S.menu.filter(m=>m.cat===c);if(!ms.length)return '';const ss=subsAll(c).filter(sb=>ms.some(m=>m.sub===sb));const rest=ms.filter(m=>!ss.includes(m.sub));return `<div class="panel" style="margin-bottom:12px;padding:6px"><h3 style="padding:10px">${esc(c)} <span class="fine">${ms.length}</span></h3>${ss.length?ss.map(sb=>`<div class="fine" style="padding:8px 10px 0;font-weight:800;color:var(--turf)">${esc(sb)}</div>`+grp(ms.filter(m=>m.sub===sb))).join('')+(rest.length?'<div class="fine" style="padding:8px 10px 0;font-weight:800">하위 분류 없음</div>'+grp(rest):''):grp(ms)}</div>`}).join('')}
 ${uncat.length?`<div class="panel"><h3>분류 없음</h3>${grp(uncat)}</div>`:''}`}

 <div class="full" style="grid-column:1/-1;display:flex;gap:12px;align-items:center">${blob(m.img)?`<img src="${blob(m.img)}" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:10px">`:''}${S.assets?`<label class="btn ghost">사진 올리기<input type="file" accept="image/png,image/jpeg,image/webp,image/gif" data-up="menuimg" hidden></label>`:'<span class="fine">사진 올리기 권한 없음</span>'}${m.img?'<button class="link" data-act="mimgrm">사진 빼기</button>':''}</div></div>
 <h3 style="margin:8px 0 0">옵션</h3>${(m.groups||[]).map((g,gi)=>`<div class="grp"><div class="crow"><input data-p="${gi}.name" value="${esc(g.name)}" placeholder="옵션 묶음 이름 (예: 맵기)"><span></span><button class="btn sm ghost" data-act="mgrm" data-g="${gi}">묶음 삭제</button></div>
 <div class="catrow"><label class="ck"><input type="checkbox" data-p="${gi}.req"${g.req?' checked':''}> 필수</label><label class="ck"><input type="checkbox" data-p="${gi}.multi"${g.multi?' checked':''}> 여러 개 선택</label></div>
 ${(g.choices||[]).map((ch,ci)=>`<div class="crow"><input data-p="${gi}.c.${ci}.name" value="${esc(ch.name)}" placeholder="선택지"><input data-p="${gi}.c.${ci}.price" inputmode="numeric" value="${esc(ch.price||0)}" placeholder="추가금"><button class="btn sm ghost" data-act="mcrm" data-g="${gi}" data-c="${ci}">×</button></div>`).join('')}

 <p class="fine">각 태블릿에서 이 페이지를 열고 해당 기기를 고르거나, 주소 끝에 #t1 같은 번호를 붙여 즐겨찾기 하세요. 연결 표시는 지금 페이지가 열려 있는지를 뜻합니다. 테스트 모드 태블릿의 주문은 매출에서 빠집니다.</p>`}

/* 내역·매출 */
function stats(rows){const r={n:0,total:0,paid:0,unpaid:0,cn:0,camt:0,byTab:{},byMenu:{},byMeth:{},byDay:{}};
 rows.forEach(o=>{if(o.test&&!S.salesTest)return;const d=r.byDay[o.dateKey]=r.byDay[o.dateKey]||{n:0,paid:0,unpaid:0,cn:0};
  if(o.status==='canceled'){r.cn++;r.camt+=o.total||0;d.cn++;return}
  r.n++;r.total+=o.total||0;d.n++;const tb=r.byTab[o.tabletName||o.tabletId]=r.byTab[o.tabletName||o.tabletId]||{n:0,amt:0,paid:0};tb.n++;tb.amt+=o.total||0;
  if(o.pay==='paid'){r.paid+=o.total||0;d.paid+=o.total||0;tb.paid+=o.total||0;r.byMeth[o.payMethod||'미기재']=(r.byMeth[o.payMethod||'미기재']||0)+(o.total||0)}else{r.unpaid+=o.total||0;d.unpaid+=o.total||0}
  (o.items||[]).forEach(i=>{const m=r.byMenu[i.name]=r.byMenu[i.name]||{q:0,amt:0};m.q+=i.qty;m.amt+=i.unit*i.qty})});return r}
function salesRows(){if(S.salesMode==='day'&&(S.salesDate===S.today||S.salesDate===addDays(S.today,-1)))return S.orders.filter(o=>o.dateKey===S.salesDate);return S.salesData&&S.salesData.rows||null}
async function loadSales(){const c=S.db.collection('orders');const q=S.salesMode==='day'?c.where('dateKey','==',S.salesDate):c.where('dateKey','>=',S.salesFrom).where('dateKey','<=',S.salesTo);
 S.salesData={loading:true};counterTab();try{const s=await timeout(q.get(),15000);S.salesData={rows:s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))}}catch(e){S.salesData={err:true}}counterTab()}
function vSales(){
 const rows=salesRows();const ctl=`<div class="bar"><h2>내역·매출</h2><div class="catrow"><button class="btn sm ${S.salesMode==='day'?'':'ghost'}" data-act="smode" data-m="day">일자별</button><button class="btn sm ${S.salesMode==='range'?'':'ghost'}" data-act="smode" data-m="range">기간별</button>
 ${S.salesMode==='day'?`<input type="date" id="sDate" value="${S.salesDate}" style="width:auto">`:`<input type="date" id="sFrom" value="${S.salesFrom}" style="width:auto"> ~ <input type="date" id="sTo" value="${S.salesTo}" style="width:auto">`}<button class="btn sm ghost" data-act="sload">조회</button><label class="ck"><input type="checkbox" data-act="stest"${S.salesTest?' checked':''}> 테스트 주문 포함</label></div></div>`;
 if(!rows)return ctl+(S.salesData&&S.salesData.loading?'<div class="empty">불러오는 중…</div>':S.salesData&&S.salesData.err?'<div class="alert">불러오지 못했습니다. 다시 조회해 주세요.</div>':'<div class="empty">조회를 눌러 주세요</div>');
 const r=stats(rows);const list=rows.filter(o=>S.salesTest||!o.test);
 const tbl=(h,body)=>`<table class="stack"><thead><tr>${h}</tr></thead><tbody>${body}</tbody></table>`;
 return ctl+`<div class="kpis"><div class="kpi main"><span>결제 완료 매출</span><b>${won(r.paid)}</b></div><div class="kpi"><span>미결제</span><b>${won(r.unpaid)}</b></div><div class="kpi"><span>주문 (취소 제외)</span><b>${r.n}건 · ${won(r.total)}</b></div><div class="kpi"><span>취소</span><b>${r.cn}건 · ${won(r.camt)}</b></div></div>
 <div class="two">${S.salesMode==='range'?`<div>${tbl('<th>날짜</th><th class="r">주문</th><th class="r">결제 완료</th><th class="r">미결제</th><th class="r">취소</th>',Object.keys(r.byDay).sort().map(d=>`<tr><td>${esc(d)}</td><td class="r">${r.byDay[d].n}</td><td class="r">${won(r.byDay[d].paid)}</td><td class="r">${won(r.byDay[d].unpaid)}</td><td class="r">${r.byDay[d].cn}</td></tr>`).join(''))}</div>`:''}
 <div>${tbl('<th>태블릿</th><th class="r">주문</th><th class="r">금액</th><th class="r">결제 완료</th>',Object.entries(r.byTab).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${v.n}</td><td class="r">${won(v.amt)}</td><td class="r">${won(v.paid)}</td></tr>`).join('')||'<tr><td colspan="4">없음</td></tr>')}</div>
 <div>${tbl('<th>메뉴</th><th class="r">수량</th><th class="r">금액</th>',Object.entries(r.byMenu).sort((a,b)=>b[1].amt-a[1].amt).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${v.q}</td><td class="r">${won(v.amt)}</td></tr>`).join('')||'<tr><td colspan="3">없음</td></tr>')}</div>
 <div>${tbl('<th>결제 수단</th><th class="r">금액</th>',Object.entries(r.byMeth).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${won(v)}</td></tr>`).join('')||'<tr><td colspan="2">없음</td></tr>')}</div></div>
 <div class="bar"><h2 style="font-size:18px">주문 목록 ${list.length}건</h2><button class="btn sm ghost" data-act="csvdl">CSV 내려받기 (엑셀)</button></div>
 ${tbl('<th>날짜·시각</th><th>자리</th><th>내용</th><th>상태</th><th>결제</th><th class="r">금액</th>',list.map(o=>`<tr><td>${esc(o.dateKey)} ${hm(o.createdAt)}</td><td>${esc(o.place||o.tabletName)}${o.test?' <span class="tag test">테스트</span>':''}</td><td>${esc((o.items||[]).map(i=>i.name+' ×'+i.qty).join(', '))}${o.memo?`<div class="fine">${esc(o.memo)}</div>`:''}</td><td>${esc(ST[o.status]||o.status)}${o.cancelReason?`<div class="fine">${esc(o.cancelReason)}</div>`:''}</td><td>${o.pay==='paid'?'완료 · '+esc(o.payMethod):'미결제'}</td><td class="r">${won(o.total)}</td></tr>`).join('')||'<tr><td colspan="6">주문 없음</td></tr>')}
 <p class="fine">날짜는 태블릿 시계의 달력 날짜(자정 기준)로 나뉩니다. 새벽 영업분을 전날 매출로 볼지 ${NEED}</p>`}
function csvText(){const rows=(salesRows()||[]).filter(o=>S.salesTest||!o.test);const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
 return [['날짜','시각','자리','태블릿','내용','상태','결제','결제수단','금액','테스트'].map(q).join(','),...rows.map(o=>[o.dateKey,hm(o.createdAt),o.place,o.tabletName,(o.items||[]).map(i=>i.name+' x'+i.qty).join(' / '),ST[o.status]||o.status,o.pay==='paid'?'완료':'미결제',o.payMethod,o.total,o.test?'Y':''].map(q).join(','))].join('\n')}

/* 장애 기록 */
function vIncidents(){const list=S.incidents.filter(i=>!S.incFilter||i.tabletId===S.incFilter);
 return `<div class="bar"><h2>장애·연결 끊김 기록</h2><select id="incF" style="width:auto"><option value="">전체 태블릿</option>${S.tablets.map(t=>`<option value="${esc(t.id)}"${S.incFilter===t.id?' selected':''}>${esc(t.name)}</option>`).join('')}</select><button class="btn" data-act="incnew">직접 기록</button></div>
 <table class="stack"><thead><tr><th>시작</th><th>복구</th><th>태블릿</th><th>유형</th><th>감지</th><th>메모</th><th></th></tr></thead><tbody>${list.map(i=>`<tr><td>${dt(i.at)}</td><td>${i.endAt?dt(i.endAt)+' ('+dur(i.endAt-i.at)+')':'<span class="tag off">진행 중</span>'}</td><td>${esc(i.tabletName||i.tabletId)}</td><td>${esc(i.kind)}</td><td>${i.source==='manual'?'직접':i.source==='auto-self'?'기기 자체':i.source==='server'?'서버 감지':'자동'}</td><td>${esc(i.note)}</td><td>${i.endAt?'':`<button class="btn sm ghost" data-act="incend" data-id="${esc(i.id)}">복구됨</button>`}</td></tr>`).join('')||'<tr><td colspan="7">기록 없음</td></tr>'}</tbody></table>

  openModal(`<h2>메뉴 가져오기</h2><div class="notice">${items.length}개 메뉴 · 새로 추가 ${items.length-upd}개 · 이미 있는 메뉴 ${upd}개(가격·설명·사진을 파일 내용으로 바꿈)</div><p class="fine">이름이 같은 메뉴는 파일 내용으로 바뀌고, 사진도 함께 올립니다. 주문 내역과 관리 PIN은 바뀌지 않습니다.</p>${d.config?`<label class="vchk"><input type="checkbox" id="impCfg" checked> 설정도 모두 그대로 적용 (매장 이름${d.config.storeName?' '+esc(d.config.storeName):''}·호출 사유·음성 안내·분류 순서·품절/숨김·준비중 그림·유튜브 동영상·프린터${Array.isArray(d.tablets)&&d.tablets.length?'·태블릿 '+d.tablets.length+'대 이름':''})</label>${d.config.videoFiles?`<p class="fine">동영상 파일 ${d.config.videoFiles}개는 용량이 커서 파일에 들어 있지 않습니다. 이 서버에서 따로 올려 주세요.</p>`:''}`:''}<label class="vchk"><input type="checkbox" id="impSync"> 파일에 없는 메뉴는 이 서버에서 지우기 (똑같이 맞추기)</label><div class="mfoot"><button class="btn ghost" data-act="close">닫기</button><button class="btn" data-act="importgo">가져오기</button></div>`);return}
 if(el.dataset.up==='video'){const fs=[...(el.files||[])];el.value='';if(!fs.length)return;if(!S.assets)return toast('올리기 권한이 없습니다','bad');
  const LIM=2*1024**3;const big=fs.filter(f=>f.size>LIM);if(big.length)toast(big.map(f=>f.name).join(', ')+': 2GB가 넘어 건너뜁니다','bad');
  let n=0;for(const f of fs.filter(f=>f.size<=LIM)){const lab='올리는 중… ('+(n+1)+'/'+(fs.length-big.length)+') '+f.name;toast(lab);window.TOD_PROGRESS=r=>toast(lab+' · '+Math.round(r*100)+'%');
   try{const r=await S.assets.upload(f,{type:/\.webm$/i.test(f.name)||f.type==='video/webm'?'video/webm':'video/mp4'});if(await saveVids([...vids(),{id:r.id,name:f.name,size:r.sizeBytes}]))n++}
   catch(err){toast(f.name+' 올리기 실패: '+((err&&err.code)||''),'bad');if(err&&err.code==='quota_or_state')break}}
  window.TOD_PROGRESS=null;if(n)toast(n+'개 추가했습니다. 모든 주문용 태블릿에 적용됩니다','ok');loadUsage();return}
 const f=el.files&&el.files[0];el.value='';if(!f)return;const kind=el.dataset.up;
 if(kind==='localvid'){S.localVid=URL.createObjectURL(f);closeModal();customerParts();toast('이 기기에서만 재생합니다. 새로고침하면 다시 골라야 합니다');return}
 if(!S.assets)return toast('올리기 권한이 없습니다','bad');
 let type;if(kind==='video'){type=/\.webm$/i.test(f.name)||f.type==='video/webm'?'video/webm':'video/mp4'}else{type=['image/png','image/jpeg','image/webp','image/gif'].includes(f.type)?f.type:'';if(!type)return toast('png, jpg, webp, gif 사진만 올릴 수 있습니다','bad')}
 let up=f;if(kind==='menuimg'&&type!=='image/gif'){toast('사진 크기 맞추는 중…');up=await shrinkImg(f,1200,type!=='image/jpeg');type=up.type||type}
 if(up.size>20*1024*1024)return toast('20MB 이하 파일만 올릴 수 있습니다','bad');
 toast('올리는 중…');
 try{const r=await S.assets.upload(up,{type});
  if(kind==='video'){if(await saveConfig({videoId:r.id,videoName:f.name,videoSize:r.sizeBytes}))toast('모든 주문용 태블릿에 적용됩니다','ok')}
  else if(S.mctx&&S.mctx.type==='menu'){S.mctx.m.img=r.id;menuModal();toast('사진을 올렸습니다. 저장을 눌러 주세요')}}
 catch(err){toast('올리기 실패: '+((err&&err.code)||''),'bad')}}
window.TOD_CAN_RELOAD=()=>modal.hidden&&!S.cart.length&&!S.sending&&!inEdit();
boot();
}
</script>
